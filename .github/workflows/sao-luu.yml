# Sao lưu database hằng đêm vào nhánh `sao-luu` của chính repo riêng tư này (người dùng chọn 2026-11-15).
# Gói Free của Supabase không có backup tự động; lịch sử git của nhánh giữ các bản cũ.
# Cần secret SUPABASE_DB_URL (chuỗi kết nối pooler, cổng 5432) trong Settings > Secrets and variables > Actions.
name: sao-luu
on:
  schedule:
    - cron: '0 18 * * *'  # 01:00 giờ Việt Nam
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sao-luu:
    runs-on: ubuntu-latest
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: 3.4.0  # ghim bản: "latest" phải gọi GitHub API không token, bị rate limit (26/11)
      - name: Lấy nhánh sao-luu (tạo mới nếu chưa có)
        run: |
          git init -q sl && cd sl
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if git fetch -q origin sao-luu; then git checkout -q -b sao-luu FETCH_HEAD; else git checkout -q --orphan sao-luu; fi
      - name: Dump
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          cd sl
          supabase db dump --db-url "$DB" -f roles.sql --role-only
          supabase db dump --db-url "$DB" -f schema.sql
          supabase db dump --db-url "$DB" -f data.sql --use-copy --data-only
      - name: Commit
        run: |
          cd sl
          git config user.name "sao-luu-bot" && git config user.email "sao-luu@users.noreply.github.com"
          # Vercel build mọi nhánh được push; nhánh này chỉ có file .sql nên bản Preview nào cũng báo Error.
          # Vercel đọc vercel.json ngay trong commit đó, nên phải đặt file vào chính nhánh sao-luu.
          echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add -A
          git commit -q -m "Sao lưu $(date -u +%F)" || echo "Không có thay đổi"
          git push -q origin sao-luu
