<title>Hướng dẫn sử dụng: Anh ngữ Ms.Nhung</title>
<style>
  body { margin: 0; padding: 24px 16px 48px; background: #fbfbf9; color: #1b1f1d; font-family: "Segoe UI", Roboto, Arial, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 24px; color: #0f7a5c; }
  p.mo { margin: 0 0 24px; color: #4a524e; max-width: 70ch; line-height: 1.5; }
  .luoi { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  figure { margin: 0; background: #fff; border: 1px solid #e4e7e5; border-radius: 6px; padding: 12px; }
  figcaption { font-weight: 600; margin-bottom: 8px; }
  figcaption span { display: block; font-weight: 400; font-size: 13px; color: #4a524e; margin-top: 2px; }
  video { width: 100%; max-height: 520px; background: #000; border-radius: 4px; }

<body>
<h1>Hướng dẫn sử dụng app Anh ngữ Ms.Nhung</h1>
<p class="mo">8 video ngắn, có giọng đọc. Xem video nào cũng được, không cần theo thứ tự. Mỗi video quay trên khung điện thoại, đúng như khi dùng thật.</p>
<div class="luoi">
  <figure><figcaption>1. Đăng nhập và làm quen<span>Đăng nhập lần đầu, đổi mật khẩu, các mục chính, cài lên điện thoại.</span></figcaption><video controls preload="metadata" src="01-dang-nhap.mp4"></video></figure>
  <figure><figcaption>2. Lớp và học sinh<span>Tạo lớp, lịch tuần, thêm học sinh có ảnh và số phụ huynh, sửa, ngừng học.</span></figcaption><video controls preload="metadata" src="02-lop-va-hoc-sinh.mp4"></video></figure>
  <figure><figcaption>3. Import bằng Excel<span>Tải file mẫu, điền, chọn file, xem lỗi, nhập.</span></figcaption><video controls preload="metadata" src="03-import-excel.mp4"></video></figure>
  <figure><figcaption>4. Điểm danh<span>Có mặt / vắng, sticker, trợ giảng, ảnh lớp, lớp nghỉ, buổi bù.</span></figcaption><video controls preload="metadata" src="04-diem-danh.mp4"></video></figure>
  <figure><figcaption>5. Ghi học phí và thu tiền<span>Tạo gói 1 / 2 / 3 tháng (học phí cần thu), thu tiền nhiều đợt.</span></figcaption><video controls preload="metadata" src="05-thu-hoc-phi.mp4"></video></figure>
  <figure><figcaption>6. Chi phí<span>Lương trợ giảng tự tính, thêm khoản chi, hoàn học phí.</span></figcaption><video controls preload="metadata" src="06-chi-phi.mp4"></video></figure>
  <figure><figcaption>7. Tab Học phí, chốt sổ, Excel<span>Xem số tháng, lọc còn nợ, nhắn phụ huynh, xuất Excel, chốt và mở khoá sổ.</span></figcaption><video controls preload="metadata" src="07-hoc-phi-chot-so-excel.mp4"></video></figure>
  <figure><figcaption>8. Dành cho phụ huynh<span>Đăng nhập bằng số điện thoại, xem buổi học, sticker, ảnh lớp, học phí.</span></figcaption><video controls preload="metadata" src="08-phu-huynh.mp4"></video></figure>
</div>
</body>
